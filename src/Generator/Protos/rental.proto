syntax = "proto3";

option csharp_namespace = "Generator.Grpc";

service RentalGenerator {
  rpc GenerateRentals (stream RentalRequest) returns (RentalResponse);
}

message RentalRequest {
  int32 carId = 1;
  int32 clientId = 2;
  string rentalStart = 3;
  int32 rentalHours = 4;
}

message RentalResponse {
  int32 count = 1;
}